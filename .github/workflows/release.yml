name: Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar tag semver
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::El tag '${GITHUB_REF_NAME}' no es semver (esperado vX.Y.Z). Ej: v1.0.0"
            exit 1
          fi

      - name: Resolver versión desde tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=tolocharadio-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Versión: ${VERSION} | versionCode: ${GITHUB_RUN_NUMBER}"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restaurar keystore desde secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64. Sigue docs/RELEASE.md para crearlo."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.keystore
          ls -l /tmp/release.keystore
        shell: bash

      - name: Build APK release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          ls -l app/build/outputs/apk/release/

      - name: Renombrar APK con versión
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"
          ls -l "${{ steps.version.outputs.apk }}"

      - name: Publicar GitHub Release con APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Tolocha Radio ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk }}
