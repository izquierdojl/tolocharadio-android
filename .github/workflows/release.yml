name: Release APK

# Se publica una sola release por PR mergeada a main, no por tag manual.
# Se saltan las PRs de mantenimiento (chore/docs/ci/test/build) salvo que
# lleven la etiqueta `release` o `release:*`.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-release-apk:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release') &&
      (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        startsWith(github.event.pull_request.title, 'feat') ||
        startsWith(github.event.pull_request.title, 'fix') ||
        startsWith(github.event.pull_request.title, 'perf') ||
        startsWith(github.event.pull_request.title, 'refactor') ||
        startsWith(github.event.pull_request.title, 'revert')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit de la PR)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calcular versión
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$LATEST" ]; then
            VERSION="1.0.0"
          else
            BASE="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            BUMP="patch"
            if printf '%s\n' "$PR_LABELS" | tr ',' '\n' | grep -qx 'release:major' ||
               printf '%s' "$PR_TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!:' ||
               printf '%s' "$PR_BODY" | grep -qi 'BREAKING CHANGE'; then
              BUMP="major"
            elif printf '%s\n' "$PR_LABELS" | tr ',' '\n' | grep -qx 'release:minor' ||
                 printf '%s' "$PR_TITLE" | grep -Eq '^feat(\(|:)'; then
              BUMP="minor"
            fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=tolocharadio-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Versión calculada: ${VERSION} (última: ${LATEST:-ninguna})"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restaurar keystore desde secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64. Sigue docs/RELEASE.md para crearlo."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.keystore
          ls -l /tmp/release.keystore
        shell: bash

      - name: Build APK release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          ls -l app/build/outputs/apk/release/

      - name: Renombrar APK con versión
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"
          ls -l "${{ steps.version.outputs.apk }}"

      - name: Publicar GitHub Release con APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: Tolocha Radio v${{ steps.version.outputs.version }}
          body: |
            Versión `v${{ steps.version.outputs.version }}` publicada al mergear la PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.html_url }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.version.outputs.apk }}
