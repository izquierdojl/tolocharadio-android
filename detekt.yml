build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: false

comments:
  active: true
  excludes: ['**/test/**', '**/androidTest/**']

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 8
  LongMethod:
    active: true
    # Los @Composable son declarativos: su longitud refleja la UI, no lógica.
    ignoreAnnotated: ['Composable']

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'Exception'
      - 'Throwable'

naming:
  active: true
  FunctionNaming:
    active: true
    # Convención oficial de Compose: los @Composable usan PascalCase.
    ignoreAnnotated: ['Composable']

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 3
    # Los validadores usan early-returns como cláusulas guarda.
    excludeGuardClauses: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '24', '100']
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true

potential-bugs:
  active: true
